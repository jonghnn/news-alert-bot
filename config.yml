# =============================================================
#  알림 설정 파일 — 이 파일만 고치면 됩니다.
#  수정 후 저장하면 다음 실행(최대 30분 뒤)부터 반영됩니다.
# =============================================================

# ── 전역 키워드 ────────────────────────────────────────────
# include: 이 단어 중 하나라도 제목/요약에 있으면 알림 (비우면 전부 통과)
# exclude: 이 단어가 있으면 무조건 제외 (include보다 우선)
# mode: any = 하나만 맞아도 통과 / all = 전부 들어있어야 통과
#
# ⚠️ include 가 적용되는 곳은 지금 GeekNews(site) 뿐입니다.
#    - news/naver : query 가 이미 검색으로 걸렀으므로 include 건너뜀
#    - issue      : filter: exclude 로 설정해 **소거법**으로 동작 (아래 참고)
#    exclude 는 모든 소스에 적용됩니다.
#
# 📌 왜 이슈 소스를 소거법으로 바꿨나 (실측 근거)
#    include 방식은 '내가 미리 떠올린 단어' 만 잡는다. 뉴스는 내가 떠올리지 못한
#    단어로 온다. 실제로 이런 기사들이 버려지고 있었다:
#      · 마이크론, 실적 호조에 가이던스도 예상치 상회    ('마이크론' 이 키워드에 없음)
#      · 경쟁 붙은 젠슨 황·리사 수                     (엔비디아·AMD CEO 이름이 없음)
#      · 美 9월 소비신뢰지수 81.9…예상 밑돌며 악화        (거시지표 단어가 없음)
#      · 구글, '제미나이 4 아르곤' 공개                 (제목에 AI/인공지능이 없음)
#      · 삼성전자, 갤S26 가격 인상                     ('삼성전자' 가 키워드에 없음)
#    대신 알림이 2.6배 늘어난다 (하루 30건 → 84건).
#    노이즈 걱정은 실측해 보니 작았다 — 제외어 후보 24개를 이슈 155건에 적용했을 때
#    걸린 것이 4건뿐이었다. 구글이 섹션으로 이미 걸러주기 때문.
#
# 📌 영문 키워드는 '단어' 단위로 찾습니다.
#    'AI' 는 said / Thailand / email / main / detail 에 걸리지 않습니다.
#    다만 'OpenAI' 처럼 영문에 붙은 형태는 못 잡으니 따로 적었습니다.
#    한글은 조사가 붙어도 잡힙니다 ('반도체' → '반도체를', '반도체株').
keywords:
  mode: any
  include:
    # AI
    - AI
    - 인공지능
    - 반도체
    - HBM
    - 엔비디아
    - 오픈AI
    - OpenAI
    # 주식
    - 주식
    - 증시
    - 코스피
    - 코스닥
    - 상장
    - 공모주
    - 파운드리
    - TSMC
    # '배당' 은 넣지 마세요 — 주식 배당과 '사건 배당'(경찰 수사 배당)이 겹쳐
    # "성추행 의혹 수사, 여청계 배당" 같은 기사가 걸립니다 (실측 오탐).
    # 코인
    - 비트코인
    - 이더리움
    - 코인
    - 가상자산
    - 암호화폐
    # 거시·무역 (증시에 직접 영향)
    - 금리
    - 환율
    - 연준
    - FOMC
    - 관세
    - 국채
    - 유가
    - 원유
    - 달러
    - 물가
    - 인플레이션
    - 무역
    - 수출
    - 공급망
    - 제재
  # ⚠️ exclude 는 신중하게. 단어 하나가 필요한 기사를 조용히 지웁니다.
  #    예: '가격' 을 넣으면 "삼성전자 갤S26 가격 인상" 이 사라집니다.
  #    실제로 받아보고 거슬리는 게 생기면 그때 추가하세요.
  exclude:
    - 광고
    - 협찬
    - 쿠팡파트너스
    - 운세
    - 부고
    - N샷          # 연예 포토 기사 태그

# ── 기본 동작 ─────────────────────────────────────────────
defaults:
  max_items_per_source: 5   # 한 번 실행에 소스당 최대 알림 개수 (폭탄 방지)
  max_age_days: 7           # 이보다 오래된 글은 무시

telegram:
  # 한 번 실행에서 나온 글을 **한 메시지로 묶어서** 보냅니다.
  # 끄면(false) 예전처럼 기사 하나당 알림 하나가 옵니다.
  #
  # 왜 켜뒀나: 소거법으로 바꾼 뒤 매 실행이 상한(34건)에 꽉 차서
  # 알림이 30개씩 쏟아졌습니다. 묶으면 34건이 메시지 4개가 됩니다.
  # (구글 뉴스 링크가 길어서 4개로 나뉩니다. 내용은 하나도 안 빠집니다.)
  digest: true

  # ── 언제 보낼지 ─────────────────────────────────────────
  # 이 시각이 '지난 뒤 첫 실행' 에서만 보냅니다. 그 외의 실행은 아무것도
  # 하지 않습니다 (수집도 안 함).
  #
  # 왜 이렇게 했나 (실측 2026-10-22):
  #   GitHub 은 예약 실행을 무작위로 버립니다 — 설정 96회/일 → 실제 6.5회/일.
  #   그래서 알림이 02:20, 04:48, 05:41, 03:07 처럼 제각각 도착했습니다.
  #   실행의 38%가 23~07시에 떨어졌고, quiet_hours 는 소리만 끌 뿐
  #   메시지는 그대로 왔습니다.
  #   실행 시각은 통제할 수 없으니 '전송 시각' 을 따로 정하는 방식입니다.
  #
  # 08:30 실행이 버려져도 다음 실행(예: 09:40)이 대신 보냅니다. 즉 도착은
  # '08:30 이후 ~ 몇 시간 안' 입니다. 정확히 08:30 은 아닙니다.
  # 시각을 늘리려면 줄을 추가하세요. 비우면([]) 예전처럼 매 실행 보냅니다.
  delivery_times: ["08:30", "19:00"]

  # 한 번에 보낼 최대 건수. 넘치면 **최신만 남기고 버립니다.**
  #
  # 왜 '버리기' 인가 (실측): 예전에는 상한을 넘으면 다음 실행으로 미뤘는데,
  # 공급이 상한의 10배라서(한 실행에 통과 260건 / 전송 28건) 큐가 영구히
  # 가득 찬 상태가 됐습니다. 적체 208건. 그래서 간격이 2시간이든 7시간이든
  # 매번 28건이 나갔고, 새벽에 오는 것도 몇 시간 전 기사였습니다.
  # 버리면 항상 '최근 것' 만 옵니다. 대신 못 보는 기사가 생깁니다.
  #
  # 하루 예상: 20건 × 2회 = 40건 (바꾸기 전 179건)
  # 소스를 번갈아 뽑으므로 글 많은 소스가 상한을 독차지하지 않습니다.
  max_per_delivery: 20

  # 메시지를 소스별 대신 **주제별**로 묶습니다 (🤖 AI·반도체 / 📈 주식·거시 / 🪙 코인).
  # 소스 이름은 제가 설정한 수집 경로일 뿐이어서, 같은 반도체 기사가 'AI 뉴스' 와
  # '기술 이슈' 로 흩어져 보였습니다. 줄 끝에 소스는 작게 남습니다.
  group_by_topic: true

  timezone: Asia/Seoul
  # 이 시간대에는 알림음 없이 조용히 전송됩니다 (안 받는 게 아니라 무음).
  # delivery_times 가 08:30/19:00 이라 지금은 걸릴 일이 없습니다.
  # 전송 시각을 심야로 옮길 때만 의미가 생깁니다.
  quiet_hours: "23:00-07:00"

# ── 관련성 점수 ────────────────────────────────────────────
# 기준: **차트에 나오는 건 보내지 않는다.**
#
#   "코인 올랐다 떨어졌다는 오히려 필요없어. 어차피 내가 차트를 볼건데 그게 뭔 상관이야.
#    오히려 서산교육지원청이 생성형 AI로 뭘 활용해서 뭘 만들었는지가 더 궁금한데?"
#                                                        — 사용자, 2026-10-26
#
# 가격·등락은 차트와 호가창에 실시간으로 있습니다. 뉴스로 받아도 정보가 늘지 않습니다.
# 뉴스가 유일하게 줄 수 있는 것은 **누가 무엇을 만들었고, 어디에 쓰였고,
# 무슨 규칙이 바뀌었나** 입니다.
#
#   시세·등락·청산·지지선·가격 수치   →  -5 (크게 깎음)
#   활용·도입·구축·출시·공개·실증     →  +3
#   기업·종목명 / 기술어 / 정책·규제   →  +3
#   거시 지표·실적                     →  +2
#   생활·부동산·사건·행사·수상         →  -5
#
# ⚠️ 첫 구현은 이것을 **정반대로** 했습니다. 시세 기사에 +18을 주고
#    "서산교육지원청, 생성형 AI 활용해 학교 행정업무 부담 줄인다" 에 -15를 줬습니다.
#    "AI·주식·코인 투자" 를 '시장 가격 뉴스' 로 혼자 해석한 결과였습니다.
#
# 키워드 필터를 통과한 기사에 **점수**를 매겨, 상한(max_per_delivery)만큼
# 점수 높은 것부터 보냅니다. 예전에는 통과한 것 중 '최신' 을 뽑았습니다.
#
# 📌 왜 필요했나 (실측 2026-10-26, 386건 풀)
#    6개 소스 중 4개가 사실상 필터 없이 통과하고 있었습니다:
#      경제 이슈  69/70  98.6%   ← filter: exclude 라 include 를 안 봄
#      기술 이슈  31/31   100%   ← 같음
#      AI 뉴스   100/100  100%   ← type: news 는 query 가 걸렀다고 보아 include 건너뜀
#      코인 뉴스  100/100  100%   ← 같음
#    321건이 통과하고 거기서 최신 20건을 뽑으니 "유럽 서머타임 종료",
#    "대웅제약 헬리코박터 제균 연구", "실외기 추락사고", "오리건 경찰 250만 달러
#    청구"(키워드 '달러' 에 걸림)가 섞여 왔습니다.
#
#    제외어를 늘리는 방향은 실측하고 버렸습니다 — 후보 38개를 386건에 적용했을 때
#    각 1~2건만 걸렸고, '브리핑' 은 오히려 쓸만한 기사(SK하이닉스 실적, 코인 시세)를
#    지웠습니다. '기부' 는 "찾기부터" 에 걸렸습니다.
#
#    점수 방식으로 바꾼 뒤 전송될 20건이 전부 투자 관련이 됐습니다.
#    넓게 받는 것(소거법)과 정밀하게 고르는 것은 서로 싸우지 않습니다.
#
# 점수 규칙은 watcher/relevance.py 에 있습니다 (단어마다 주석 있음):
#    기업·종목명 +4   자산명(비트코인·코스피·유가) +4
#    시장 용어 +2     거시 지표 +2     기술 용어 +2
#    보도자료·행사 -4 (개최·세미나·수상·선임·협약…)
#    관공서·대학 -5   의료·제약 연구 -5   생활·부동산·사건 -4
#    자동번역 제목("~하고 있습니다.") -3
relevance:
  enabled: true

  # 이 점수 미만은 아예 안 보냅니다. 공급이 적은 날은 20건이 안 찰 수 있는데,
  # 쓸모없는 걸 채워 보내는 것보다 적게 오는 게 낫다고 보고 이렇게 뒀습니다.
  min_score: 4

  # 주제별 최대 건수. 여기 숫자가 실제로 받는 구성을 정합니다.
  #
  # ⚠️ 왜 할당이 필요한가 (실측): 활용 사례 기사는 +3~+6점인데 엔비디아 산업
  #    기사는 +9~+18점입니다. 점수만으로 줄 세우면 활용 사례가 한 건도 안 들어옵니다.
  #    가중치를 올려 맞추는 것보다 **자리를 숫자로 보장**하는 쪽이 확실합니다.
  #
  # 코인을 2로 둔 이유: 시세 기사를 빼고 나면 남는 건 과세·규제·상장 같은
  # 사건뿐이고, 그건 하루 몇 건 안 됩니다. 더 받고 싶으면 숫자를 올리세요.
  # 숫자는 추측이 아니라 **실측 공급**에 맞췄습니다 (386건 풀, 4점 이상 기준):
  #   AI 활용·사례 33건 / AI·반도체 산업 40건 / 코인 5건 / 기타 4건 / 주식·거시 0건
  # 주식·거시가 0인 이유: 기업 이름이 들어간 기사는 'AI·반도체 산업' 으로 가고,
  # 남는 순수 거시 기사는 대부분 가격 보도라서 점수가 깎입니다.
  # 할당이 남으면 다른 주제가 그 자리를 채웁니다(빈손으로 보내지 않음).
  quotas:
    AI 활용·사례: 7      # "뭘 활용해서 뭘 만들었나" — 가장 궁금하다고 하신 것
    AI·반도체 산업: 8    # 기업 전략·실적·공급망
    주식·거시: 2         # 수주·정책 (공급이 얇음)
    코인: 2              # 시세 아닌 것만 (과세·규제·상장)
    기타: 1

  # 한 소스가 상한을 독차지하지 않게 합니다 (코인 뉴스는 한 번에 100건 옵니다).
  max_per_source: 6

  # 제목 단어가 이 비율 이상 겹치면 같은 기사로 보고 하나만 보냅니다.
  # 제목 해시 중복제거는 글자 하나만 달라도 못 잡습니다. 실측으로 이 셋이
  # 같은 전송에 들어왔습니다:
  #   · S&P500기업 분기이익 30% ↑…'엔비디아·마이크론' 쏠림
  #   · S&P500 이익 증가분 34%는 엔비디아·마이크론…'AI 쏠림' 심화
  #   · S&P500 분기이익 30% 급증 전망, 엔비디아·마이크론 쏠림
  # 낮추면 더 공격적으로 묶습니다 (0.3). 높이면 중복이 늘어납니다 (0.6).
  similar_threshold: 0.4

  # 내가 특별히 챙기는 종목·주제가 있으면 여기 적으세요 (+4점).
  add: []
  #  - 리게티
  #  - 한미반도체

  # 점수를 깎을 단어 (-5점). 받아보고 거슬리는 유형이 생기면 추가하세요.
  penalize: []
  #  - 부동산

# ── 감시할 소스 목록 ───────────────────────────────────────
# 빼고 싶으면 enabled: false 로 바꾸거나 그냥 줄을 지우세요.
sources:

  # ============ 이슈 전개 추적 ============
  # 같은 사건 기사를 묶어서 1번만 알리고, 그 사건에 새 기사가 붙으면
  # 무엇이 추가됐는지만 알려줍니다. (같은 내용 반복 안 옴)
  #
  # section 에 넣을 수 있는 값:
  #   세계 / 국내 / 경제 / 기술 / 과학 / 건강 / 스포츠 / 연예
  #
  # 키워드 판정은 '대표 제목' 만 봅니다 (묶음 안 기사 제목까지 보면
  # 곁가지 기사 하나 때문에 엉뚱한 이슈가 걸립니다 — 실측 오탐 다수).
  #
  # 섹션별 실측 (키워드 통과 수 / 하루 예상 / 묶음 있는 비율):
  #   경제  24개 · 22건/일 · 묶음 22개  ← 이슈 전개 추적이 제대로 작동
  #   기술  23개 · 13건/일 · 묶음 0개   ← 묶음은 없지만 21건이 순증
  #   세계   6개 ·  7건/일 · 묶음 5개   ← 관세·유가·제재·달러
  #   과학  12개 ·  2건/일 · 묶음 0개
  #   국내   2개 · 표본부족 · 오탐 있었음
  #   건강   1개 · 드묾
  #
  # ⚠️ '묶음이 없으면 무의미' 가 아닙니다. 묶음이 없으면 기사 1건이
  #    🆕 새 이슈로 한 번 올 뿐이고, 그것도 충분히 쓸모 있습니다.
  #    특히 기술 섹션은 'AI 뉴스' 검색과 겹침이 5% 뿐이어서 거의 전부 순증입니다
  #    (예: "오픈AI 훈련 멈추자 반도체주 휘청" 은 AI 뉴스로는 안 들어옴).
  - name: 경제 이슈
    type: issue
    section: 경제
    filter: exclude      # 소거법 — 제외어만 걸러내고 나머지는 전부
    max_items: 8
    issue_ttl_days: 7     # 이 기간 안 보인 이슈는 추적 중단
    enabled: true

  - name: 기술 이슈
    type: issue
    section: 기술
    filter: exclude      # 소거법 — 제외어만 걸러내고 나머지는 전부
    max_items: 6
    enabled: true

  # ⚠️ 세계 섹션만 소거법을 쓰지 않습니다.
  #    경제·기술은 섹션 자체가 주제를 보장하지만(키워드에 안 걸려도 내용은 경제),
  #    세계는 전쟁·정치·사건사고가 본질이라 투자와 무관한 게 대부분입니다.
  #    실측: 소거법으로 두면 35건 중 30건(86%)이 무관했습니다 —
  #    "러시아 드론 학교 타격", "35일 연속 비 온 도쿄", "눈꺼풀에서 송곳니가 자랐다" 등.
  #
  #    그래서 이 소스만 아래 전용 키워드를 씁니다 (거시·무역·기술).
  #    소스에 keywords 를 적으면 전역 키워드 대신 이게 쓰입니다. 35건 → 5건.
  - name: 세계 이슈
    type: issue
    section: 세계
    max_items: 5
    enabled: true
    keywords:
      mode: any
      include:
        # 거시·무역 (유가·환율·관세는 증시에 직접 영향)
        - 관세
        - 유가
        - 원유
        - 환율
        - 달러
        - 금리
        - 국채
        - 연준
        - FOMC
        - 인플레이션
        - 물가
        - 무역
        - 수출
        - 수입
        - 공급망
        - 제재
        - 증시
        - 주가
        - GDP
        - 실업률
        # 기술·자산
        - 반도체
        - AI
        - 인공지능
        - 엔비디아
        - 오픈AI
        - 비트코인
        - 가상자산
        - 코인
      exclude:
        - 광고
        - 협찬
        - 운세
        - 부고

  # 하루 2건 정도라 켜도 부담 없습니다. 품질은 아직 확인 안 해봤습니다.
  - name: 과학 이슈
    type: issue
    section: 과학
    max_items: 3
    enabled: false

  # 실측: 이슈 70개 중 키워드 통과 2~3개, 그중 오탐이 섞였습니다
  # ('AI 사진', '여청계 배당'). 정치·사회 기사가 대부분입니다.
  - name: 국내 이슈
    type: issue
    section: 국내
    max_items: 5
    enabled: false

  # ============ 뉴스 키워드 검색 ============
  # 위의 '기술 이슈' 와 겹치지 않습니다 (실측 겹침률 5%).
  # 섹션은 구글이 골라준 주요 뉴스, 검색은 키워드에 걸리는 모든 기사라서
  # 선택 방식이 달라 서로 보완됩니다.
  #
  # 📌 검색어는 넓게 잡으세요. 글자 그대로 들어간 기사만 검색됩니다.
  #    'HBM' 기사 99건 중 83건에는 '반도체'라는 글자가 없었습니다.
  #    OR 로 묶으면 좁은 검색이 놓친 44건을 더 잡았습니다.
  #    단 구글은 한 번에 약 100건까지만 주므로 너무 많이 묶으면 서로 밀어냅니다.
  - name: AI 뉴스
    type: news
    query: '인공지능 OR "생성형 AI" OR LLM OR 엔비디아 OR HBM OR 온디바이스'
    lang: ko
    country: KR
    enabled: true

  # ⚠️ '가상자산' 은 넣지 마세요. 규제·법률 기사에 광범위하게 쓰여서
  #    하루 6건 → 98건으로 16배 폭증합니다 (실측).
  #    코인 규제 뉴스까지 받고 싶으면 그때만 추가하세요.
  - name: 코인 뉴스
    type: news
    query: '비트코인 OR 이더리움'
    lang: ko
    country: KR
    enabled: true

  # 경제 이슈와 겹치므로 기본은 꺼둡니다. 더 촘촘히 받고 싶으면 켜세요.
  - name: 증시 뉴스
    type: news
    query: '코스피 OR 코스닥 OR 공모주 OR "금리 인하"'
    lang: ko
    country: KR
    enabled: false

  # 네이버 뉴스 — 한국 언론사 커버리지가 더 넓습니다.
  # 쓰려면 키 2개를 먼저 발급받으세요 (무료, 5분):
  #   https://developers.naver.com/apps/#/register
  #   → 사용 API 에서 "검색" 선택 → Client ID / Client Secret 복사
  #   → GitHub Secrets 에 NAVER_CLIENT_ID / NAVER_CLIENT_SECRET 로 등록
  # 키를 등록하지 않으면 이 소스는 조용히 건너뜁니다 (오류 아님).
  - name: 네이버 AI 뉴스
    type: naver
    query: 인공지능 반도체
    display: 30           # 한 번에 조회할 개수 (최대 100)
    enabled: false        # 키를 등록한 뒤 true 로 바꾸세요

  # ============ 유튜브 채널 ============
  # channel 에는 아래 셋 중 아무거나 넣어도 됩니다:
  #   "@핸들"  /  "https://www.youtube.com/@핸들"  /  "UCxxxxxxxx..." (채널ID)
  #
  # ⚠️ 유튜브는 "AI 영상만 검색"이 불가능합니다. 최신 영상을 통째로 받아
  #    위 include 키워드로 걸러냅니다. 그래서 키워드에 안 맞으면 0건이 됩니다.
  #    그 채널 영상을 전부 받으려면 filter: false 를 넣으세요.
  #
  # 아래는 예시입니다. 실제로 보시는 채널로 바꿔주세요.
  # 2026-09-30 기준 유튜브 RSS 가 404 를 자주 돌려줍니다 (요청 몰리면 차단되는 듯).
  # 채널 페이지 조회를 건너뛰려면 UC로 시작하는 ID를 직접 넣는 게 낫습니다.
  # 조코딩 실제 채널 ID: UCQNE2JmbasNYbjGAcuBiRRg
  - name: 조코딩
    type: youtube
    channel: UCQNE2JmbasNYbjGAcuBiRRg
    enabled: false

  - name: 노마드코더
    type: youtube
    channel: "@nomadcoders"
    enabled: false

  # ============ 일반 웹사이트 ============
  # 1) RSS 주소를 알면 그대로 url 에 넣기 (가장 정확)
  # 2) 일반 주소만 넣어도 RSS를 자동으로 찾아봅니다
  # 3) RSS가 없으면 selector 로 글 목록 링크를 지정
  - name: GeekNews
    type: site
    url: https://news.hada.io/
    enabled: true

  # ❌ 코인데스크코리아(coindeskkorea.com/rss) 는 넣지 마세요.
  #    도메인이 용도변경된 듯 내용이 암호화폐와 무관합니다 — 실측한 제목들:
  #    "통영 카페드안트워프 영업시간", "비닐하우스 파이프 가격", "부산 돼지국밥 맛집"
  #    게다가 요약 꼬리말의 매체명 '코인데스크' 가 키워드 '코인' 에 걸려서
  #    50건 전부 필터를 통과했습니다. 지금은 꼬리말을 떼어내도록 고쳤지만,
  #    내용 자체가 쓸모없어서 제외합니다.
  #
  # ⚠️ 새 피드를 추가할 때 주의: 매체 이름이 내 키워드와 겹치면
  #    (예: 키워드 'AI' + 매체 'AI타임스') 그 피드 전체가 통과할 수 있습니다.
  #    추가 전에 dry-run 으로 '통과율' 을 확인하세요. 100% 면 의심해야 합니다.

  # ─────────────────────────────────────────────────────────
  # 아래 매체들은 실측해 보고 **일부러 넣지 않았습니다.**
  # 매체 전체 RSS 는 취재 범위가 내 키워드와 거의 같아서 필터가 걸러낼 게 없습니다.
  # (매일경제 증권은 68%가 통과했습니다.) 7개 다 켜면 하루 808건입니다.
  #
  #   ZDNet코리아   https://feeds.feedburner.com/zdkorea      258건/일
  #   토큰포스트     https://www.tokenpost.kr/rss              281건/일
  #   연합뉴스 경제  https://www.yna.co.kr/rss/economy.xml     153건/일
  #   전자신문       https://rss.etnews.com/Section901.xml      57건/일
  #   매일경제 증권  https://www.mk.co.kr/rss/50200011/         35건/일
  #   매일경제 경제  https://www.mk.co.kr/rss/30100041/         17건/일
  #
  # 죽은 피드 (403/404): 한국경제, 서울경제, 블로터, 이데일리, 연합뉴스 IT
  #
  # 특정 매체를 꼭 받고 싶으면 그 소스에 좁은 keywords 를 따로 달아주세요.
  # 예:  keywords: { include: [엔비디아, HBM] }
  # ─────────────────────────────────────────────────────────

  # 네이버 블로그는 RSS가 살아있어서 키 없이 바로 됩니다.
  # 주소는 rss.blog.naver.com/{블로그아이디}.xml 형식입니다.
  # - name: 어떤 네이버 블로그
  #   type: site
  #   url: https://rss.blog.naver.com/블로그아이디.xml
  #   enabled: true

  # RSS가 아예 없는 사이트 (F12 → 글 제목 우클릭 → 검사 → Copy selector)
  # - name: 사내 공지사항
  #   type: site
  #   url: https://example.com/notice
  #   selector: "table.board a.title"
  #   enabled: true
