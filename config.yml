# =============================================================
#  알림 설정 파일 — 이 파일만 고치면 됩니다.
#  수정 후 저장하면 다음 실행(최대 30분 뒤)부터 반영됩니다.
# =============================================================

# ── 전역 키워드 ────────────────────────────────────────────
# include: 이 단어 중 하나라도 제목/요약에 있으면 알림 (비우면 전부 통과)
# exclude: 이 단어가 있으면 무조건 제외 (include보다 우선)
# mode: any = 하나만 맞아도 통과 / all = 전부 들어있어야 통과
#
# ⚠️ include 는 뉴스 검색(news/naver)에는 적용되지 않습니다.
#    거기선 query 가 이미 검색으로 걸렀기 때문입니다. exclude 는 적용됩니다.
#    유튜브·사이트·이슈(issue)에는 include 가 적용됩니다.
#
# 📌 영문 키워드는 '단어' 단위로 찾습니다.
#    'AI' 는 said / Thailand / email / main / detail 에 걸리지 않습니다.
#    다만 'OpenAI' 처럼 영문에 붙은 형태는 못 잡으니 따로 적었습니다.
#    한글은 조사가 붙어도 잡힙니다 ('반도체' → '반도체를', '반도체株').
keywords:
  mode: any
  include:
    # AI
    - AI
    - 인공지능
    - 반도체
    - HBM
    - 엔비디아
    - 오픈AI
    - OpenAI
    # 주식
    - 주식
    - 증시
    - 코스피
    - 코스닥
    - 상장
    - 공모주
    - 파운드리
    - TSMC
    # '배당' 은 넣지 마세요 — 주식 배당과 '사건 배당'(경찰 수사 배당)이 겹쳐
    # "성추행 의혹 수사, 여청계 배당" 같은 기사가 걸립니다 (실측 오탐).
    # 코인
    - 비트코인
    - 이더리움
    - 코인
    - 가상자산
    - 암호화폐
    # 거시·무역 (증시에 직접 영향)
    - 금리
    - 환율
    - 연준
    - FOMC
    - 관세
    - 국채
    - 유가
    - 원유
    - 달러
    - 물가
    - 인플레이션
    - 무역
    - 수출
    - 공급망
    - 제재
  exclude:
    - 광고
    - 협찬
    - 쿠팡파트너스
    - 운세
    - 부고

# ── 기본 동작 ─────────────────────────────────────────────
defaults:
  max_items_per_source: 5   # 한 번 실행에 소스당 최대 알림 개수 (폭탄 방지)
  max_age_days: 7           # 이보다 오래된 글은 무시

telegram:
  timezone: Asia/Seoul
  # 이 시간대에는 알림음 없이 조용히 전송됩니다 (안 받는 게 아니라 무음)
  quiet_hours: "23:00-07:00"

# ── 감시할 소스 목록 ───────────────────────────────────────
# 빼고 싶으면 enabled: false 로 바꾸거나 그냥 줄을 지우세요.
sources:

  # ============ 이슈 전개 추적 ============
  # 같은 사건 기사를 묶어서 1번만 알리고, 그 사건에 새 기사가 붙으면
  # 무엇이 추가됐는지만 알려줍니다. (같은 내용 반복 안 옴)
  #
  # section 에 넣을 수 있는 값:
  #   세계 / 국내 / 경제 / 기술 / 과학 / 건강 / 스포츠 / 연예
  #
  # 키워드 판정은 '대표 제목' 만 봅니다 (묶음 안 기사 제목까지 보면
  # 곁가지 기사 하나 때문에 엉뚱한 이슈가 걸립니다 — 실측 오탐 다수).
  #
  # 섹션별 실측 (키워드 통과 수 / 하루 예상 / 묶음 있는 비율):
  #   경제  24개 · 22건/일 · 묶음 22개  ← 이슈 전개 추적이 제대로 작동
  #   기술  23개 · 13건/일 · 묶음 0개   ← 묶음은 없지만 21건이 순증
  #   세계   6개 ·  7건/일 · 묶음 5개   ← 관세·유가·제재·달러
  #   과학  12개 ·  2건/일 · 묶음 0개
  #   국내   2개 · 표본부족 · 오탐 있었음
  #   건강   1개 · 드묾
  #
  # ⚠️ '묶음이 없으면 무의미' 가 아닙니다. 묶음이 없으면 기사 1건이
  #    🆕 새 이슈로 한 번 올 뿐이고, 그것도 충분히 쓸모 있습니다.
  #    특히 기술 섹션은 'AI 뉴스' 검색과 겹침이 5% 뿐이어서 거의 전부 순증입니다
  #    (예: "오픈AI 훈련 멈추자 반도체주 휘청" 은 AI 뉴스로는 안 들어옴).
  - name: 경제 이슈
    type: issue
    section: 경제
    max_items: 8
    issue_ttl_days: 7     # 이 기간 안 보인 이슈는 추적 중단
    enabled: true

  - name: 기술 이슈
    type: issue
    section: 기술
    max_items: 6
    enabled: true

  - name: 세계 이슈
    type: issue
    section: 세계
    max_items: 5
    enabled: true

  # 하루 2건 정도라 켜도 부담 없습니다. 품질은 아직 확인 안 해봤습니다.
  - name: 과학 이슈
    type: issue
    section: 과학
    max_items: 3
    enabled: false

  # 실측: 이슈 70개 중 키워드 통과 2~3개, 그중 오탐이 섞였습니다
  # ('AI 사진', '여청계 배당'). 정치·사회 기사가 대부분입니다.
  - name: 국내 이슈
    type: issue
    section: 국내
    max_items: 5
    enabled: false

  # ============ 뉴스 키워드 검색 ============
  # 위의 '기술 이슈' 와 겹치지 않습니다 (실측 겹침률 5%).
  # 섹션은 구글이 골라준 주요 뉴스, 검색은 키워드에 걸리는 모든 기사라서
  # 선택 방식이 달라 서로 보완됩니다.
  #
  # 📌 검색어는 넓게 잡으세요. 글자 그대로 들어간 기사만 검색됩니다.
  #    'HBM' 기사 99건 중 83건에는 '반도체'라는 글자가 없었습니다.
  #    OR 로 묶으면 좁은 검색이 놓친 44건을 더 잡았습니다.
  #    단 구글은 한 번에 약 100건까지만 주므로 너무 많이 묶으면 서로 밀어냅니다.
  - name: AI 뉴스
    type: news
    query: '인공지능 OR "생성형 AI" OR LLM OR 엔비디아 OR HBM OR 온디바이스'
    lang: ko
    country: KR
    enabled: true

  # ⚠️ '가상자산' 은 넣지 마세요. 규제·법률 기사에 광범위하게 쓰여서
  #    하루 6건 → 98건으로 16배 폭증합니다 (실측).
  #    코인 규제 뉴스까지 받고 싶으면 그때만 추가하세요.
  - name: 코인 뉴스
    type: news
    query: '비트코인 OR 이더리움'
    lang: ko
    country: KR
    enabled: true

  # 경제 이슈와 겹치므로 기본은 꺼둡니다. 더 촘촘히 받고 싶으면 켜세요.
  - name: 증시 뉴스
    type: news
    query: '코스피 OR 코스닥 OR 공모주 OR "금리 인하"'
    lang: ko
    country: KR
    enabled: false

  # 네이버 뉴스 — 한국 언론사 커버리지가 더 넓습니다.
  # 쓰려면 키 2개를 먼저 발급받으세요 (무료, 5분):
  #   https://developers.naver.com/apps/#/register
  #   → 사용 API 에서 "검색" 선택 → Client ID / Client Secret 복사
  #   → GitHub Secrets 에 NAVER_CLIENT_ID / NAVER_CLIENT_SECRET 로 등록
  # 키를 등록하지 않으면 이 소스는 조용히 건너뜁니다 (오류 아님).
  - name: 네이버 AI 뉴스
    type: naver
    query: 인공지능 반도체
    display: 30           # 한 번에 조회할 개수 (최대 100)
    enabled: false        # 키를 등록한 뒤 true 로 바꾸세요

  # ============ 유튜브 채널 ============
  # channel 에는 아래 셋 중 아무거나 넣어도 됩니다:
  #   "@핸들"  /  "https://www.youtube.com/@핸들"  /  "UCxxxxxxxx..." (채널ID)
  #
  # ⚠️ 유튜브는 "AI 영상만 검색"이 불가능합니다. 최신 영상을 통째로 받아
  #    위 include 키워드로 걸러냅니다. 그래서 키워드에 안 맞으면 0건이 됩니다.
  #    그 채널 영상을 전부 받으려면 filter: false 를 넣으세요.
  #
  # 아래는 예시입니다. 실제로 보시는 채널로 바꿔주세요.
  # 2026-09-30 기준 유튜브 RSS 가 404 를 자주 돌려줍니다 (요청 몰리면 차단되는 듯).
  # 채널 페이지 조회를 건너뛰려면 UC로 시작하는 ID를 직접 넣는 게 낫습니다.
  # 조코딩 실제 채널 ID: UCQNE2JmbasNYbjGAcuBiRRg
  - name: 조코딩
    type: youtube
    channel: UCQNE2JmbasNYbjGAcuBiRRg
    enabled: false

  - name: 노마드코더
    type: youtube
    channel: "@nomadcoders"
    enabled: false

  # ============ 일반 웹사이트 ============
  # 1) RSS 주소를 알면 그대로 url 에 넣기 (가장 정확)
  # 2) 일반 주소만 넣어도 RSS를 자동으로 찾아봅니다
  # 3) RSS가 없으면 selector 로 글 목록 링크를 지정
  - name: GeekNews
    type: site
    url: https://news.hada.io/
    enabled: true

  # ❌ 코인데스크코리아(coindeskkorea.com/rss) 는 넣지 마세요.
  #    도메인이 용도변경된 듯 내용이 암호화폐와 무관합니다 — 실측한 제목들:
  #    "통영 카페드안트워프 영업시간", "비닐하우스 파이프 가격", "부산 돼지국밥 맛집"
  #    게다가 요약 꼬리말의 매체명 '코인데스크' 가 키워드 '코인' 에 걸려서
  #    50건 전부 필터를 통과했습니다. 지금은 꼬리말을 떼어내도록 고쳤지만,
  #    내용 자체가 쓸모없어서 제외합니다.
  #
  # ⚠️ 새 피드를 추가할 때 주의: 매체 이름이 내 키워드와 겹치면
  #    (예: 키워드 'AI' + 매체 'AI타임스') 그 피드 전체가 통과할 수 있습니다.
  #    추가 전에 dry-run 으로 '통과율' 을 확인하세요. 100% 면 의심해야 합니다.

  # ─────────────────────────────────────────────────────────
  # 아래 매체들은 실측해 보고 **일부러 넣지 않았습니다.**
  # 매체 전체 RSS 는 취재 범위가 내 키워드와 거의 같아서 필터가 걸러낼 게 없습니다.
  # (매일경제 증권은 68%가 통과했습니다.) 7개 다 켜면 하루 808건입니다.
  #
  #   ZDNet코리아   https://feeds.feedburner.com/zdkorea      258건/일
  #   토큰포스트     https://www.tokenpost.kr/rss              281건/일
  #   연합뉴스 경제  https://www.yna.co.kr/rss/economy.xml     153건/일
  #   전자신문       https://rss.etnews.com/Section901.xml      57건/일
  #   매일경제 증권  https://www.mk.co.kr/rss/50200011/         35건/일
  #   매일경제 경제  https://www.mk.co.kr/rss/30100041/         17건/일
  #
  # 죽은 피드 (403/404): 한국경제, 서울경제, 블로터, 이데일리, 연합뉴스 IT
  #
  # 특정 매체를 꼭 받고 싶으면 그 소스에 좁은 keywords 를 따로 달아주세요.
  # 예:  keywords: { include: [엔비디아, HBM] }
  # ─────────────────────────────────────────────────────────

  # 네이버 블로그는 RSS가 살아있어서 키 없이 바로 됩니다.
  # 주소는 rss.blog.naver.com/{블로그아이디}.xml 형식입니다.
  # - name: 어떤 네이버 블로그
  #   type: site
  #   url: https://rss.blog.naver.com/블로그아이디.xml
  #   enabled: true

  # RSS가 아예 없는 사이트 (F12 → 글 제목 우클릭 → 검사 → Copy selector)
  # - name: 사내 공지사항
  #   type: site
  #   url: https://example.com/notice
  #   selector: "table.board a.title"
  #   enabled: true
