name: 알림 봇

on:
  schedule:
    # 15분마다(:10, :25, :40, :55) 실행합니다.
    #
    # ⚠️ 정각(:00)·반(:30)은 피하세요. GitHub 공식 문서:
    #   "The schedule event can be delayed during periods of high loads...
    #    High load times include the start of every hour."
    #   "If the load is sufficiently high enough, some queued jobs may be dropped."
    #   "To decrease the chance of delay, schedule your workflow to run at a
    #    different time of the hour."
    # 실제로 "*/30" (=:00,:30) 으로 뒀더니 예약 실행이 한 번도 안 떴습니다.
    #
    # :00/:30 뿐 아니라 :15/:45 도 피했습니다. 남들이 많이 쓰는 */15 슬롯이라
    # 거기도 붐빕니다. :10/:25/:40/:55 는 네 지점 모두에서 떨어져 있습니다.
    #
    # 주기를 바꾸려면 분(앞 숫자)만 고치세요. 정각·15분 배수는 피할 것:
    #   30분마다: "10,40 * * * *"   /   매시간 1회: "10 * * * *"
    - cron: "10,25,40,55 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = 평소 실행 / test = 테스트 메시지 / chatid = 내 chat_id 확인"
        type: choice
        options: [run, test, chatid]
        default: run
      dry_run:
        description: "전송 없이 결과만 확인"
        type: boolean
        default: false

permissions:
  contents: write

# 이전 실행이 끝나기 전에 다음 실행이 겹치면 상태 파일이 충돌한다.
concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 새 글 확인 및 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 네이버 소스를 쓸 때만 필요합니다. 없으면 해당 소스만 건너뜁니다.
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python -m watcher.main \
            --mode "${{ inputs.mode || 'run' }}" \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: 본 글 기록 저장
        if: ${{ always() && inputs.mode != 'chatid' && inputs.dry_run != true }}
        run: |
          if git diff --quiet -- state/; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "chore: 알림 기록 갱신 [skip ci]"
          # 다른 실행이 먼저 밀어넣었을 수 있으므로 한 번 재시도한다.
          git push || (git pull --rebase --autostash && git push)
