name: 알림 봇

on:
  schedule:
    # 30분마다 실행. 더 자주/덜 자주 받고 싶으면 이 숫자만 바꾸세요.
    #   매시간: "0 * * * *"   /   10분마다: "*/10 * * * *"
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = 평소 실행 / test = 테스트 메시지 / chatid = 내 chat_id 확인"
        type: choice
        options: [run, test, chatid]
        default: run
      dry_run:
        description: "전송 없이 결과만 확인"
        type: boolean
        default: false

permissions:
  contents: write

# 이전 실행이 끝나기 전에 다음 실행이 겹치면 상태 파일이 충돌한다.
concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 새 글 확인 및 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 네이버 소스를 쓸 때만 필요합니다. 없으면 해당 소스만 건너뜁니다.
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python -m watcher.main \
            --mode "${{ inputs.mode || 'run' }}" \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: 본 글 기록 저장
        if: ${{ always() && inputs.mode != 'chatid' && inputs.dry_run != true }}
        run: |
          if git diff --quiet -- state/; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "chore: 알림 기록 갱신 [skip ci]"
          # 다른 실행이 먼저 밀어넣었을 수 있으므로 한 번 재시도한다.
          git push || (git pull --rebase --autostash && git push)
